# Bundled Postgres for cela (docs/install-plan.md D3). One replica, no HA, no backup: for evaluation.
# Production uses an external Postgres instead.

nameOverride: ""
fullnameOverride: ""

# Pinned by digest (multi-arch index). Upgrade on purpose; a major version change needs a dump and restore.
image:
  repository: postgres
  tag: 17-bookworm
  digest: sha256:40865bc877a289da75963d97d72b59633f639fc5af7a4e856bfa3714cae5b536
  pullPolicy: IfNotPresent

# Secrets are only referenced, never created or generated here (D8). The Secrets must exist before the install.
auth:
  superuser:
    existingSecret: pi-postgres-auth
    passwordKey: postgres-password
  # Application databases. Each role owns its database and is not a superuser; nobody else may connect to it.
  databases:
    pi:
      name: pi
      role: pi
      existingSecret: pi-postgres-auth
      passwordKey: pi-password
    onecli:
      name: onecli
      role: onecli
      existingSecret: pi-postgres-auth
      passwordKey: onecli-password
  # The egress proxy's read-only role (charts/cela egressProxy, ADR 0035), created in the `pi` database: it may
  # connect and gets the grants of egress.grant_proxy_reader (read the egress rule tables, write its own status row).
  # Off by default. Match charts/cela egressProxy.database.role to this role: the app reconciles grants after
  # migrations, without restarting Postgres. The init sidecar grants only if the grant function already exists.
  egressReader:
    enabled: false
    role: pi_egress
    existingSecret: pi-postgres-auth
    passwordKey: egress-password

# Serve TLS. A Secret (kubernetes.io/tls shape) holding the server certificate chain and key; this chart never creates
# it (D8). The certificate must name the Service (`<release>`, `<release>.<ns>.svc`) for clients that verify-full, and
# its CA goes to the clients (the app chart's database.tls.existingSecret).
tls:
  existingSecret: "" # "" = no TLS (plain connections, as before)
  certKey: tls.crt
  keyKey: tls.key
  # true: remote clients must use TLS (pg_hba `hostssl` only, plain TCP rejected). Leave false while OneCLI's own
  # connection string does not ask for TLS; the Pod-local unix socket (probes, init) is unaffected.
  requireTls: false

persistence:
  size: 10Gi
  storageClass: "" # "" = the cluster default class
  # true: the PVC survives helm uninstall and a StatefulSet deletion (the data is kept; a later install reuses it).
  # false: the PVC is deleted with the StatefulSet.
  retain: true

resources:
  postgres:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  init:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }

# Ingress to 5432 is admitted only from pods matching one of these labels in the same namespace. Add the e2e client or
# another consumer here. An empty list admits nobody.
networkPolicy:
  enabled: true
  clientSelectors:
    - { app.kubernetes.io/name: pi-orchestrator }
    - { app.kubernetes.io/name: pi-ingest }
    - { app.kubernetes.io/name: onecli }
    # The egress proxy reads the rules (auth.egressReader). Harmless while no such pod exists.
    - { app.kubernetes.io/name: pi-egress-proxy }

# Seconds Kubernetes waits for a clean shutdown.
terminationGracePeriodSeconds: 60

podLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
