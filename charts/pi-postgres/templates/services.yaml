# Headless Service: the stable network identity of the StatefulSet Pod.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-postgres.fullname" . }}-headless
  labels:
    {{- include "pi-postgres.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "pi-postgres.selectorLabels" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# The Service clients use: <release>.<namespace>.svc:5432.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pi-postgres.fullname" . }}
  labels:
    {{- include "pi-postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pi-postgres.selectorLabels" . | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
