{{- /*
One SandboxWarmPool per size, plus the unsized pi-env-pool on the default size (see template.yaml), and with
security.allowDirectSandboxEgress the same set for the direct mode, pi-env-direct-pool[-<size>] (ADR 0038). Direct pools
keep no warm Pods: they are template aliases, so allowing direct egress doubles nothing. No pool keeps warm Pods
(replicas is always 0, and the schema caps every warmPoolReplicas at 0): claims carry env, so they are never adopted (ADR 0001).
The pool objects stay because a SandboxClaim must reference one (plan.md). With
sandbox.flavours.browser.enabled the browser flavour has the same set, pi-env-browser[-direct]-pool[-<size>]
(docs/decisions/0041-browser-sandbox.md), and with sandbox.flavours.desktop.enabled so does the desktop flavour,
pi-env-desktop[-direct]-pool[-<size>] (docs/decisions/0065-desktop-sandbox.md). Each entry of sandbox.runtimes (ADR 0064) has the proxied set of its flavours,
pi-env-rt-<runtime>[-browser|-desktop]-pool[-<size>], over its own templates.
*/ -}}
{{- $root := . -}}
{{- $modes := list "proxied" -}}
{{- if .Values.security.allowDirectSandboxEgress }}{{- $modes = append $modes "direct" -}}{{- end -}}
{{- $browser := $root.Values.sandbox.flavours.browser -}}
{{- $desktop := $root.Values.sandbox.flavours.desktop -}}
{{- $flavours := list "default" -}}
{{- if $browser.enabled }}{{- $flavours = append $flavours "browser" -}}{{- end -}}
{{- if $desktop.enabled }}{{- $flavours = append $flavours "desktop" -}}{{- end -}}
{{- $runtimes := list (dict "name" "default" "infix" "" "flavours" $flavours "modes" $modes) -}}
{{- range $rname := keys $root.Values.sandbox.runtimes | sortAlpha -}}
{{- $rt := index $root.Values.sandbox.runtimes $rname -}}
{{- $runtimes = append $runtimes (dict "name" $rname "infix" (printf "rt-%s-" $rname) "flavours" ($rt.flavours | default (list "default")) "modes" (list "proxied")) -}}
{{- end -}}
{{- $pools := list -}}
{{- range $rt := $runtimes -}}
{{- range $flavour := $rt.flavours -}}
{{- range $mode := $rt.modes -}}
{{- $pool := ternary "pi-env-direct-pool" "pi-env-pool" (eq $mode "direct") -}}
{{- $template := ternary "pi-env-direct-template" "pi-env-template" (eq $mode "direct") -}}
{{- if ne $flavour "default" }}
{{- $pool = replace "pi-env-" (printf "pi-env-%s-" $flavour) $pool -}}
{{- $template = replace "pi-env-" (printf "pi-env-%s-" $flavour) $template -}}
{{- end -}}
{{- $pool = replace "pi-env-" (printf "pi-env-%s" $rt.infix) $pool -}}
{{- $template = replace "pi-env-" (printf "pi-env-%s" $rt.infix) $template -}}
{{- $pools = append $pools (dict "name" $pool "template" $template "size" $root.Values.sandbox.defaultSize "mode" $mode "flavour" $flavour "runtime" $rt.name) -}}
{{- range $name := keys $root.Values.sandbox.sizes | sortAlpha -}}
{{- $pools = append $pools (dict "name" (printf "%s-%s" $pool $name) "template" (printf "%s-%s" $template $name) "size" $name "mode" $mode "flavour" $flavour "runtime" $rt.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $i, $p := $pools -}}
{{- if $i }}
---
{{ end -}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "cela.labels" $root | nindent 4 }}
    cela.dev/sandbox-size: {{ $p.size }}
    cela.dev/network-mode: {{ $p.mode }}
    cela.dev/sandbox-flavour: {{ $p.flavour }}
    pi-durable.dev/sandbox-runtime: {{ $p.runtime }}
spec:
  replicas: 0
  sandboxTemplateRef:
    name: {{ $p.template }}
{{ end -}}
