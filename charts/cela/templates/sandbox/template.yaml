{{- /*
One SandboxTemplate per size (docs/decisions/0030-sandbox-sizes.md), plus the unsized pi-env-template with the default
size for claims made before sizes existed (they reference pi-env-pool) and for the e2e suites' own claims. Each is a
`proxied` template. With security.allowDirectSandboxEgress, every one of them also has a `direct` twin named
pi-env-direct-template[-<size>] (docs/decisions/0038-network-modes.md): the same Pod but for the label
cela.dev/network-mode, which the NetworkPolicies select on. The label is baked into the template because Pods
cannot be relabelled without RBAC the orchestrator must not have; choosing the warm pool chooses the network position.
With sandbox.flavours.browser.enabled every one of them also has a `browser` twin, pi-env-browser[-direct]-template[-<size>]
(docs/decisions/0041-browser-sandbox.md): the browser image, its own resources and a memory-backed /dev/shm.
Each entry of sandbox.runtimes (ADR 0064) adds the same set under its own RuntimeClass, for the flavours it lists, proxied
mode only: pi-env-rt-<runtime>[-browser]-template[-<size>]. The default runtime keeps the names above. Every object carries
the label pi-durable.dev/sandbox-runtime (the runtime's name, or `default`), which the orchestrator's start guard groups by.
*/ -}}
{{- $root := . -}}
{{- $modes := list "proxied" -}}
{{- if .Values.security.allowDirectSandboxEgress }}{{- $modes = append $modes "direct" -}}{{- end -}}
{{- $browser := $root.Values.sandbox.flavours.browser -}}
{{- $flavours := list "default" -}}
{{- if $browser.enabled }}{{- $flavours = append $flavours "browser" -}}{{- end -}}
{{- /* The default runtime first, then the named ones; each has its own class, flavours and modes. */ -}}
{{- $runtimes := list (dict "name" "default" "infix" "" "class" $root.Values.sandbox.runtimeClassName "flavours" $flavours "modes" $modes) -}}
{{- range $rname := keys $root.Values.sandbox.runtimes | sortAlpha -}}
{{- $rt := index $root.Values.sandbox.runtimes $rname -}}
{{- $runtimes = append $runtimes (dict "name" $rname "infix" (printf "rt-%s-" $rname) "class" $rt.runtimeClassName "flavours" ($rt.flavours | default (list "default")) "modes" (list "proxied")) -}}
{{- end -}}
{{- $templates := list -}}
{{- range $rt := $runtimes -}}
{{- range $flavour := $rt.flavours -}}
{{- range $mode := $rt.modes -}}
{{- $prefix := ternary "pi-env-direct-template" "pi-env-template" (eq $mode "direct") -}}
{{- if eq $flavour "browser" }}{{- $prefix = replace "pi-env-" "pi-env-browser-" $prefix -}}{{- end -}}
{{- $prefix = replace "pi-env-" (printf "pi-env-%s" $rt.infix) $prefix -}}
{{- $templates = append $templates (dict "name" $prefix "size" $root.Values.sandbox.defaultSize "mode" $mode "flavour" $flavour "runtime" $rt.name "class" $rt.class) -}}
{{- range $name := keys $root.Values.sandbox.sizes | sortAlpha -}}
{{- $templates = append $templates (dict "name" (printf "%s-%s" $prefix $name) "size" $name "mode" $mode "flavour" $flavour "runtime" $rt.name "class" $rt.class) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $i, $t := $templates -}}
{{- $size := index $root.Values.sandbox.sizes $t.size -}}
{{- $isBrowser := eq $t.flavour "browser" -}}
{{- $resources := ternary $browser.resources $size.resources $isBrowser -}}
{{- $ephemeral := ternary $browser.ephemeralStorage $size.ephemeralStorage $isBrowser -}}
{{- if $i }}
---
{{ end -}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $t.name }}
  labels:
    {{- include "cela.labels" $root | nindent 4 }}
    cela.dev/sandbox-size: {{ $t.size }}
    cela.dev/network-mode: {{ $t.mode }}
    cela.dev/sandbox-flavour: {{ $t.flavour }}
    pi-durable.dev/sandbox-runtime: {{ $t.runtime }}
spec:
  # Each SandboxClaim carries its own SANDBOXD_AUTH_TOKEN_SHA256 (the hash of HMAC(master, claimName), set by the
  # orchestrator). Allowed lets a claim ADD that variable; the template must not define it, because Allowed rejects an
  # override. Fail closed: a Pod made from a claim without it gets the literal `$(SANDBOXD_AUTH_TOKEN_SHA256)` text as
  # its hash, which no token matches (docs/decisions/0001-per-sandbox-sandboxd-token.md).
  envVarsInjectionPolicy: Allowed
  service: true
  networkPolicyManagement: Unmanaged # this chart owns the policies (templates/networkpolicy)
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $root.Values.sandbox.storageClass }}
        storageClassName: {{ $root.Values.sandbox.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $size.workspaceSize }}
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pi-sandbox
        # The policies select on it (ADR 0038); absent or unknown means proxied, never direct.
        cela.dev/network-mode: {{ $t.mode }}
        cela.dev/sandbox-flavour: {{ $t.flavour }}
        pi-durable.dev/sandbox-runtime: {{ $t.runtime }}
    spec:
      {{- if $t.class }}
      runtimeClassName: {{ $t.class }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: Always
      securityContext:
        {{- include "cela.podSecurityContext" $root | nindent 8 }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandboxd
          {{- if $isBrowser }}
          image: {{ include "cela.image" (dict "name" "sandboxBrowser" "image" $root.Values.images.sandboxBrowser) }}
          imagePullPolicy: {{ $root.Values.images.sandboxBrowser.pullPolicy }}
          {{- else }}
          image: {{ include "cela.image" (dict "name" "sandbox" "image" $root.Values.images.sandbox) }}
          imagePullPolicy: {{ $root.Values.images.sandbox.pullPolicy }}
          {{- end }}
          args:
            - --auth-token-sha256=$(SANDBOXD_AUTH_TOKEN_SHA256)
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /v1/health, port: 8080 }
            # The Kubernetes default of 10 s adds up to 10 s to every claim and resume once sandboxd is healthy (issue #82).
            # The probe is a local HTTP GET answered by sandboxd, so 1 s costs next to nothing.
            periodSeconds: 1
          resources:
            {{- $limits := merge (dict "ephemeral-storage" $ephemeral) ($resources.limits | default dict) }}
            {{- toYaml (dict "requests" $resources.requests "limits" $limits) | nindent 12 }}
          securityContext:
            {{- include "cela.containerSecurityContext" $root | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            {{- if $isBrowser }}
            - name: dshm
              mountPath: /dev/shm
            {{- end }}
      {{- if $isBrowser }}
      volumes:
        # Chromium keeps shared memory for its renderers here; the 64Mi default of a Pod crashes tabs. It counts against
        # the container's memory limit.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $browser.shmSize }}
      {{- end }}
{{ end -}}
