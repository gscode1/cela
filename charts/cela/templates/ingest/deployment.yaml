# ingest: the stateless HTTP front of the session API, any node, no volume, no Kubernetes access. It never talks to
# the orchestrators except to proxy a stream, so it keeps accepting events while one restarts. Its readiness depends on
# the database only, and on a route for every shard that already holds sessions.
{{- $shards := int .Values.orchestrator.shards }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-ingest
  labels:
    app.kubernetes.io/name: pi-ingest
    {{- include "cela.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-ingest
        app.kubernetes.io/part-of: cela
      annotations:
        checksum/model-config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "cela.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pi-ingest
      containers:
        - name: ingest
          image: {{ include "cela.image" (dict "name" "ingest" "image" .Values.images.ingest) }}
          imagePullPolicy: {{ .Values.images.ingest.pullPolicy }}
          # SEED ONLY: the model settings (see pi-model-config).
          envFrom:
            - configMapRef: { name: pi-model-config }
          env:
            - { name: HOME, value: /tmp }
            - { name: PI_INGEST_PORT, value: "8080" }
            {{- if .Values.egressProxy.enabled }}
            - { name: PI_EGRESS_READER_ROLE, value: {{ .Values.egressProxy.database.role | quote }} }
            {{- end }}
            # Shards can only grow: a session stays on its shard (ADR 0017). Ingest refuses to start when stored
            # sessions name a shard without a route.
            - { name: PI_ORCH_SHARDS, value: {{ $shards | quote }} }
            - { name: PI_ORCH_URL, value: {{ ternary "http://pi-orchestrator:8081" "http://pi-orchestrator-{shard}:8081" (eq $shards 1) | quote }} }
            # The sizes the chart rendered templates for (docs/decisions/0030-sandbox-sizes.md): what POST /sessions and
            # profiles may name, and what GET /admin/sandbox-sizes lists.
            - { name: PI_SANDBOX_SIZES, value: {{ .Values.sandbox.sizes | toJson | quote }} }
            - { name: PI_SANDBOX_DEFAULT_SIZE, value: {{ .Values.sandbox.defaultSize | quote }} }
            # The flavours rendered besides the default (ADR 0041, 0065); without one the API refuses it as sandboxFlavour.
            {{- $enabledFlavours := list }}
            {{- if .Values.sandbox.flavours.browser.enabled }}{{- $enabledFlavours = append $enabledFlavours "browser" }}{{- end }}
            {{- if .Values.sandbox.flavours.desktop.enabled }}{{- $enabledFlavours = append $enabledFlavours "desktop" }}{{- end }}
            - { name: PI_SANDBOX_FLAVOURS, value: {{ join "," $enabledFlavours | quote }} }
            # The named sandbox runtimes rendered (ADR 0064): what a profile's sandboxRuntime may name. {} without any.
            - { name: PI_SANDBOX_RUNTIMES, value: {{ include "cela.runtimesJson" . | quote }} }
            # Lets profiles and sessions use networkMode direct (ADR 0038); without it the API answers 400.
            - { name: PI_ALLOW_DIRECT_SANDBOX_EGRESS, value: {{ .Values.security.allowDirectSandboxEgress | quote }} }
            # Owners (names from the api Secret, not secrets) who may call /admin/*.
            - { name: PI_API_ADMINS, value: {{ join "," .Values.api.admins | quote }} }
            {{- if .Values.console.enabled }}
            # The built console is in the image (images/ingest/Dockerfile); without this variable /console/ is a 404.
            - { name: PI_CONSOLE_DIR, value: /app/console }
            # manage | readOnly: served to the page as /console/config.json; it hides write controls, the API is unchanged.
            - { name: PI_CONSOLE_CATALOGS, value: {{ .Values.console.catalogs | quote }} }
            {{- end }}
            {{- if .Values.liveView.enabled }}
            # The public live view (ADR 0066): the origin its URLs start with, and the viewer page and noVNC in the image
            # (images/ingest/Dockerfile). Without them `/live/*` is a 404 and the API refuses `liveView`.
            - { name: PI_LIVE_VIEW_PUBLIC_URL, value: {{ .Values.liveView.publicUrl | quote }} }
            - { name: PI_LIVE_VIEW_DIR, value: /app/live-view }
            {{- end }}
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: PI_DURABLE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.external.existingSecret }}, key: {{ .Values.database.external.uriKey }} } }
            {{- include "cela.databaseTlsEnv" . | nindent 12 }}
            - name: PI_API_TOKENS
              valueFrom: { secretKeyRef: { name: {{ .Values.api.existingSecret }}, key: tokens } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          securityContext:
            {{- include "cela.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            {{- if include "cela.databaseTlsEnabled" . }}
            {{- include "cela.databaseTlsMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if include "cela.databaseTlsEnabled" . }}
        {{- include "cela.databaseTlsVolume" . | nindent 8 }}
        {{- end }}
