# The Pi Durable app (docs/install-plan.md D1): orchestrator shards, ingest (the session API), the sandbox template and
# warm pool, RBAC and network policies. The database, OneCLI and agent-sandbox (controller and CRDs) are NOT part of
# it: they are separate and only referenced here. One release per namespace: object names are fixed (pi-orchestrator,
# pi-ingest, pi-env-template, ...) because the policies, the e2e suites and ingest's shard routing rely on them.
#
# Secrets are only referenced, never created or generated (D8). hack/install.sh creates the missing ones once.

# Required: a tag or a digest per image (prefer a digest). Build them with images/build.sh; CI publishes them.
images:
  orchestrator:
    repository: ghcr.io/gscode1/pi-orchestrator
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  ingest:
    repository: ghcr.io/gscode1/pi-ingest
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  sandbox:
    repository: ghcr.io/gscode1/pi-sandbox
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Needed with sandbox.flavours.browser.enabled (the default): a tag or a digest, like the sandbox image (the chart fails
  # without one). Set sandbox.flavours.browser.enabled=false to install without it.
  sandboxBrowser:
    repository: ghcr.io/gscode1/pi-sandbox-browser
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Needed with sandbox.flavours.desktop.enabled (off by default): a tag or a digest, like the sandbox image (the chart fails
  # without one).
  sandboxDesktop:
    repository: ghcr.io/gscode1/pi-sandbox-desktop
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Needed with egressProxy.enabled (the default).
  egressProxy:
    repository: ghcr.io/gscode1/pi-egress-proxy
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

database:
  # Any Postgres 17 (CloudNativePG included) that the orchestrator and ingest reach directly or in session mode, never
  # through a transaction pooler (the adapter's ownership lock is a session advisory lock). One install per database:
  # the schema `inbox` is fixed. A bundled Postgres comes with charts/pi-postgres (a separate release).
  external:
    existingSecret: "" # required: a Secret in the release namespace that holds the connection URI
    uriKey: uri
    # Where the orchestrator and ingest may connect. Required: with default-deny-all the database is otherwise
    # unreachable. A pod selector (in `namespace`, default: the release namespace) and/or CIDRs.
    egress:
      namespace: ""
      podSelector: {}
      cidrs: []
      port: 5432
  # The release name of the bundled charts/pi-postgres, when that is the database ("" for any other Postgres). The egress
  # proxy then also blocks its headless Service (the Pod's own address, which a NetworkPolicy opens directly), not only
  # the ClusterIP that the database host of its URI resolves to. hack/kind-up.sh sets it.
  bundled:
    release: ""
  # TLS towards the database, for both pools (orchestrator and ingest). The orchestrator and ingest verify the server;
  # there is no mode that encrypts without verifying.
  #   disable      no TLS (a plain install; the URI's own sslmode, if any, still applies)
  #   verify-full  chain and host name must match the CA (use this)
  #   verify-ca    the chain must verify, the host name need not match (a server certificate without the host's name)
  # With a mode other than disable, `sslmode` and certificate parameters must not be in the URI (they would conflict).
  tls:
    mode: disable
    existingSecret: "" # required unless mode is disable: a Secret in the release namespace with the keys below
    caKey: ca.crt # PEM bundle that signed the server certificate; required for verify-ca, "" uses the system roots
    certKey: "" # optional client certificate (mutual TLS); set certKey and keyKey together
    keyKey: ""

onecli:
  # bundled: the OneCLI release that hack/onecli.sh installs in this namespace (upstream chart, its own release;
  #   docs/decisions/0022-bundled-onecli.md). The URLs, the agent token, the admin key and the CA come from onecli.bundled.
  # external: use an existing OneCLI (gateway and management API URLs below).
  # disabled: no OneCLI; the scripted model only (the allowlist may name no other provider).
  mode: disabled
  # Names of the agents and secrets this install creates in OneCLI. A shared OneCLI needs a distinct prefix per install,
  # because every orchestrator's orphan sweep revokes the agents it does not know (ADR 0013).
  namePrefix: pi-session-
  # The orchestrator keeps OneCLI's host rules (the gateway's allowlist, docs/onecli-host-rules.md) in step with the egress
  # rules (docs/decisions/0040-mcp-egress-flow.md): one `pi-egress-allow-<host>` rule per host a route=onecli rule or an MCP
  # catalog row asks for, so a catalog PUT makes a server reachable within seconds. It never changes a hand-made rule except
  # that it recreates the terminal `block *` behind its own (the gateway applies rules in creation order). Needs the admin
  # key (onecli.*.adminKeySecret). Off by default: the operator may manage the host rules by script.
  hostRules:
    reconcile: false
  # Names the bundled release and its bootstrap (hack/onecli-bootstrap.sh) produce; its defaults are the same. Change
  # them only together with the bootstrap's ONECLI_* variables.
  bundled:
    release: onecli # Helm release name of the upstream chart: Services <release>-api and <release>-gateway
    caConfigMap: pi-onecli-ca # key ca.pem: the PUBLIC gateway CA
    agentTokenSecret: pi-onecli # key agent-token (aoc_...): the orchestrator's token
    adminKeySecret: pi-onecli-admin # key api-key (oc_...): only that key reaches the orchestrator, not the login password
  external:
    apiUrl: "" # required for external, for example http://onecli.onecli:10256 (management API and the CA)
    gatewayUrl: "" # required for external, for example http://onecli.onecli:10255 (the proxy that injects credentials)
    caConfigMap: "" # optional: ConfigMap with key ca.pem, the gateway CA the orchestrator trusts (read once at start)
    agentTokenSecret: "" # optional: Secret with key agent-token (aoc_...), required for any non-scripted model
    adminKeySecret: "" # optional: Secret with key api-key (oc_...); repo sessions are refused without it
    # Where OneCLI runs, for the network policies. The ports come from the URLs.
    namespace: onecli
    podSelector:
      app: onecli

agentSandbox:
  # The controller and its CRDs are cluster-wide and are never installed, upgraded or removed by this chart. Check or
  # install them with hack/agent-sandbox.sh. bundled arrives with the bundled install steps and is rejected for now.
  mode: external

sandbox:
  # Only the operator picks the runtime, never a session caller. Anything but gvisor (including "": the node default,
  # usually runc) needs security.allowInsecureRuntime, or the chart refuses to render (docs/decisions/0020).
  runtimeClassName: gvisor
  # Further named runtimes (docs/decisions/0064-sandbox-runtimes.md): a profile picks one with `sandboxRuntime: <name>`; a
  # session never does. The runtime above (with security.allowInsecureRuntime) stays the default runtime, called `default`
  # in the API, and every session without a choice uses it. Each entry renders, for the flavours it lists and for the
  # proxied network mode only (no direct twin), the SandboxTemplates and SandboxWarmPools
  # pi-env-rt-<name>[-browser|-desktop]-template[-<size>] and -pool[-<size>], under its own RuntimeClass. Empty (the default) renders nothing more.
  # Name: 1 to 16 of [a-z0-9], starting with a letter, no hyphen; not default, browser, desktop, direct, pool, template or rt.
  # runtimeClassName: a RuntimeClass that exists on the nodes (not checked here). gVisor means the class `gvisor` or
  # `gvisor-<anything>`; any other class needs its own `allowInsecureRuntime: true`. security.allowInsecureRuntime covers
  # the default runtime only, never a named one. An insecure runtime shares the node kernel with other Pods: give its
  # RuntimeClass `scheduling.nodeSelector` and `tolerations` onto tainted nodes that run nothing else.
  # flavours: which flavours it renders; each must be enabled (sandbox.flavours). Default: [default].
  # The isolation probe still runs under the default runtime only.
  # Example:
  #   runtimes:
  #     gvisorkvm: { runtimeClassName: gvisor-kvm, flavours: [default, browser] }
  #     runc: { runtimeClassName: runc-insecure, allowInsecureRuntime: true, flavours: [default] }
  runtimes: {}
  storageClass: "" # workspace PVCs; "" = the cluster default. Use a class that reclaims with Delete.
  masterSecret: sandboxd-auth # Secret with key `master`: HMAC key of every sandbox's token. A backup asset.
  # Named sandbox sizes (docs/decisions/0030-sandbox-sizes.md). Each renders a SandboxTemplate pi-env-template-<name> and
  # a SandboxWarmPool pi-env-pool-<name>; profiles and POST /sessions pick among them, never free numbers. A changed
  # size applies to new sessions only. Names: 1 to 16 of [a-z0-9-], starting with a letter.
  # warmPoolReplicas must stay 0 (the schema refuses more): every claim carries spec.env, so agent-sandbox never adopts a
  # warm Pod for it, and Pods built without the env crash-loop (ADR 0001, ADR 0030). The pool is only a template alias.
  defaultSize: s
  sizes:
    s: # the size every sandbox had before sizes existed
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 250m, memory: 256Mi }
      workspaceSize: 1Gi
      ephemeralStorage: 1Gi # limit on what the sandbox writes outside /workspace
      warmPoolReplicas: 0
    m:
      resources:
        requests: { cpu: 500m, memory: 1Gi }
        limits: { cpu: "1", memory: 2Gi }
      workspaceSize: 5Gi
      ephemeralStorage: 2Gi
      warmPoolReplicas: 0
    l:
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { cpu: "2", memory: 4Gi }
      workspaceSize: 10Gi
      ephemeralStorage: 4Gi
      warmPoolReplicas: 0
    xl:
      resources:
        requests: { cpu: "2", memory: 4Gi }
        limits: { cpu: "4", memory: 8Gi }
      workspaceSize: 20Gi
      ephemeralStorage: 8Gi
      warmPoolReplicas: 0

  # Sandbox flavours besides the default (docs/decisions/0041-browser-sandbox.md).
  flavours:
    # The browser flavour: the sandbox image plus Chromium, Patchright and agent-browser (images/sandbox-browser).
    # On (the default): renders pi-env-browser[-direct]-template[-<size>] and -pool[-<size>] for every size and network mode, and lets a
    # profile say `sandboxFlavour: browser`. Off: none of that exists and the API refuses the field. On is the default
    # (owner decision, ADR 0041 amendment of 2026-11-19); it needs images.sandboxBrowser and costs nothing until a session
    # asks for it (no warm Pods). Set `enabled: false` to skip the 1.6 GB image. A browser session never has credentials (no repo, no onecli route, no credentialed MCP).
    browser:
      enabled: true
      # Its own limits, whatever the size: Chromium needs far more memory than a shell (measured: docs/decisions/0041).
      # The size still sets the workspace volume.
      resources:
        requests: { cpu: 500m, memory: 768Mi }
        limits: { cpu: "1", memory: 1536Mi }
      ephemeralStorage: 2Gi # the browser's profile and cache live outside /workspace and are wiped at each start
      shmSize: 256Mi # memory-backed /dev/shm; counts against the memory limit
      warmPoolReplicas: 0 # must be 0 (the schema refuses more); see sandbox.sizes
    # The desktop flavour (docs/decisions/0065-desktop-sandbox.md): the sandbox image plus a virtual X desktop (Xvfb, openbox),
    # mousepad, LibreOffice Writer, Firefox and agent-desktop (images/sandbox-desktop).
    # Off (the default): none of it exists and the API refuses `sandboxFlavour: desktop`. On: renders
    # pi-env-desktop[-direct]-template[-<size>] and -pool[-<size>] for every size and network mode, and for each named runtime that lists
    # `desktop`; needs images.sandboxDesktop. It costs nothing until a session asks for it (no warm Pods). A desktop session never has
    # credentials (no repo, no onecli route, no credentialed MCP), and its desktop is lost when the Pod is recycled.
    desktop:
      enabled: false
      # Its own limits, whatever the size: a desktop with Firefox or LibreOffice needs far more than a shell (measured: ADR 0065).
      # The size still sets the workspace volume.
      resources:
        requests: { cpu: "1", memory: 2Gi }
        limits: { cpu: "4", memory: 6Gi }
      ephemeralStorage: 4Gi # the apps' profiles and caches live outside /workspace and are wiped at each start
      shmSize: 256Mi # memory-backed /dev/shm; counts against the memory limit
      warmPoolReplicas: 0 # must be 0 (the schema refuses more); see sandbox.sizes

security:
  # Acknowledges that the sandbox runtime is not gVisor. The orchestrator refuses to start without it too
  # (PI_ALLOW_INSECURE_RUNTIME) and reports the configured and the observed runtime in GET /admin/status.
  allowInsecureRuntime: false
  # Lets a profile choose `networkMode: direct` (docs/decisions/0038-network-modes.md): its sandboxes reach the open internet
  # and DNS directly, with no egress rule and no audit (private, cluster, metadata and platform addresses stay blocked).
  # Off (the default): the chart renders no direct template, pool or policy, and the API refuses `networkMode: direct`.
  # Needs egressProxy.enabled: without the proxy every sandbox already has the open internet.
  allowDirectSandboxEgress: false
  # A ValidatingAdmissionPolicy (cluster-scoped, Kubernetes 1.30+) that limits the Pods the orchestrator may create to the
  # isolation probe Pod: its image, no volume, no Secret, fixed labels and ServiceAccount (docs/decisions/0063). Without it
  # the orchestrator's `create pods` right lets a compromised orchestrator mount any Secret of the namespace. Turn it off
  # only on a cluster that cannot serve admissionregistration.k8s.io/v1 ValidatingAdmissionPolicy, or when the installer may
  # not create cluster-scoped objects.
  probePodPolicy:
    enabled: true

networkPolicy:
  # cilium: also CiliumNetworkPolicies (kube-apiserver entity, FQDN rule for the GitHub App). Needs the Cilium CRDs.
  # standard: plain NetworkPolicy only; the orchestrator gets an egress rule to the API server instead.
  provider: cilium
  # standard only: the API server's addresses (kubectl get endpoints kubernetes). Empty: TCP 443 and 6443 to any
  # destination, because a plain policy cannot name the API server.
  kubeApiCidrs: []
  dns:
    namespace: kube-system
    podSelector:
      k8s-app: kube-dns
  ingest:
    # Who may reach ingest :8080, as raw NetworkPolicy `from` entries, for example an ingress controller:
    #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system } }
    #     podSelector: { matchLabels: { app.kubernetes.io/name: envoy } }
    # Empty: no policy (ingest is reachable by port-forward only). kubelet probes and port-forward come from the node.
    clients: []
  orchestrator:
    # Extra raw egress rules, for example api.github.com:443 with provider standard and kubeApiCidrs.
    extraEgress: []
  sandbox:
    # CIDRs (IPv4 or IPv6) that sandboxes must not reach on top of the built-in private, CGNAT, link-local and loopback
    # ranges: the Kubernetes API endpoint when it has a public address, global IPv6 node and pod ranges, an external
    # database or OneCLI on a public IP, NAT64 64:ff9b::/96. Appended to sandbox-allow-internet-egress by address family.
    extraEgressExcept: []

orchestrator:
  # One Deployment per shard, one replica each, strategy Recreate (one owner per schema, ADR 0017). The count can only
  # grow: sessions stay on their shard, and ingest refuses to start when it sees sessions on a shard without a route.
  shards: 1
  resources:
    requests: { cpu: 100m, memory: 2Gi }
    limits: { cpu: "1", memory: 2Gi }
  # Added to NO_PROXY (the model dispatcher already bypasses cluster suffixes, the database and the OneCLI API).
  noProxy: []
  # Extra environment variables as {name, value} (test switches, tuning).
  extraEnv: []

ingest:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }
  # kind only (hack/kind-up.sh sets it): an extra NodePort Service, so the session API is on the host's localhost:8080
  # without `kubectl port-forward` (kind publishes the NodePort, hack/kind-config.yaml). `externalTrafficPolicy: Local`
  # keeps the client's source address, and one policy admits exactly one source: `sourceCidr`, a /32 (the IPv4 gateway
  # of the kind Docker network, where the host's connections come from). Never turn this on in a real cluster. Off:
  # nothing is rendered.
  expose:
    enabled: false
    nodePort: 30080
    sourceCidr: ""
  # Optional routes to the pi-ingest Service (port 8080), off by default (ADR 0026). Either one also needs
  # networkPolicy.ingest.clients to admit the gateway's or controller's pods; the chart refuses to render without it.
  # `paths` are path prefixes: ["/"] serves the session API, /admin and the console; ["/console", "/admin"] serves only
  # the operator screens. Ingest does not rate-limit failed sign-ins: keep a route on a trusted network, or rate-limit on
  # the gateway.
  # Gateway API HTTPRoute (needs the Gateway API CRDs). Example for an Envoy Gateway `main`:
  #   parentRefs: [{ name: main, namespace: envoy-gateway-system, sectionName: https }]
  #   hostnames: [pi.example.lan]
  httpRoute:
    enabled: false
    parentRefs: []
    hostnames: []
    paths: ["/"]
    annotations: {}
    # Gateway API durations. `stream` is GET /sessions/{id}/stream (server-sent events, rendered as its own rule when
    # `paths` cover /sessions/): "0s" means no total limit, because a session may run for days; a client resumes with
    # Last-Event-ID. `request` is every other path; "" keeps the gateway's default (Envoy Gateway: 15s).
    timeouts:
      request: ""
      stream: "0s"
  # networking.k8s.io/v1 Ingress. Set stream timeouts with your controller's annotations (for example ingress-nginx
  # nginx.ingress.kubernetes.io/proxy-read-timeout), since the session stream is long-lived. `tls` is the Ingress `spec.tls` list as is, for example
  #   [{ hosts: [pi.example.lan], secretName: pi-tls }]
  ingress:
    enabled: false
    className: ""
    hosts: []
    paths: ["/"]
    tls: []
    annotations: {}

# The admin console: a static web app that ingest serves under /console/ (docs/admin-ui-plan.md). Off by default, and
# then /console/ is a 404. The page holds no secret; the operator's token (api.admins) is typed into it and goes only
# to /admin/*. Reach it by `kubectl port-forward svc/pi-ingest 8080` or a route restricted to operators
# (ingest.httpRoute or ingest.ingress): where ingest also serves ordinary clients, route /console and /admin through
# operator access only.
# The session mail server (docs/session-mail.md, ADR 0068). Off by default. Set `server` to the catalog name of an MCP server
# you register (with a OneCLI `onecliSecret`) that implements the mail contract: the orchestrator then sets the owner
# header on its requests only, and browser profiles may name it although it is credentialed. cela ships no mail backend.
sessionMail:
  server: ""

console:
  enabled: false
  # What the Skills and MCP servers screens offer: `manage` (publish, register, edit, delete) or `readOnly` (browse
  # only; zip download stays). This gates the page, not the API: /admin/* still accepts writes from every admin.
  # Use readOnly when a catalog repository is the one writer (docs/admin-ui-plan.md).
  catalogs: manage

# Public view-only live view of desktop sessions (issue #418, docs/decisions/0066-desktop-public-live-view.md). Off by
# default. On: a session of a desktop profile can be created with `liveView: true`, and PUT /sessions/{id}/live-view turns
# it on later; each gives a URL, `<publicUrl>/live/<token>`, that ANYONE who has it can open to watch that desktop, with no
# login and no input. Treat the URL like a password: it is the only credential, it is returned only to the session's owner,
# and PUT rotates it (DELETE turns it off). Needs sandbox.flavours.desktop.enabled.
liveView:
  enabled: false
  # The origin viewers reach `/live/*` at (scheme and host, no path): what the URLs start with. Required when enabled.
  # Your Gateway or Ingress must route it to ingest (httpRoute below).
  publicUrl: ""
  maxViewersPerSession: 4 # the 5th gets a 429; the orchestrator also caps 32 per shard
  # A separate HTTPRoute `pi-live-view` for the `/live/` prefix only, so the anonymous surface can have its own hostname
  # (recommended) and its own policy. Needs networkPolicy.ingest.clients, like ingest.httpRoute. The WebSocket must outlive
  # the gateway's default request timeout: the rule sets `request: "0s"`.
  httpRoute:
    enabled: false
    parentRefs: []
    hostnames: []
    annotations: {}

api:
  # Owners who may call /admin/*. Each needs a token in the Secret.
  admins: [admin]
  existingSecret: api-auth # key `tokens`: one `owner:token` line per API owner

# Seeds Postgres once (inbox.settings, ADR 0008); later changes go through PUT /admin/settings. The allowlist decides
# which providers the orchestrator installs at start. "provider/model", the model id may contain slashes.
models:
  default:
    provider: scripted
    id: scripted-1
    reasoning: medium
  allowlist:
    - scripted/scripted-1
    - scripted/scripted-2
  turnBudget: 100
  tokenBudget: null # tokens one session may use in total (ADR 0028); null: no limit
  # Operator-defined OpenAI-compatible providers (docs/decisions/0056-custom-model-providers.md, docs/model-credentials.md).
  # Not a seed: every orchestrator shard reads this at start, so a change restarts them; removing a provider breaks the
  # stored conversations that name it at their next turn. Their models are then in GET /admin/models and can be put on the
  # allowlist above or later with PUT /admin/settings, per session and per profile, like the builtin ones. Per entry:
  #   id        ^[a-z][a-z0-9-]*$, not a builtin provider id, scripted or faux
  #   baseUrl   the OpenAI-compatible root, without /chat/completions (no credentials, query or fragment)
  #   via       onecli (default) or direct
  #   egress    direct only: { cidr, port }, one IPv4 CIDR and port, rendered as the orchestrator's egress rule
  #   compat    optional pi-ai openai-completions flags (supportsStore, supportsDeveloperRole, supportsReasoningEffort,
  #             supportsUsageInStreaming, supportsFinishReason, maxTokensField, requiresToolResultName,
  #             requiresAssistantAfterToolResult, requiresNonNullAssistantContent, requiresToolsWithToolHistory,
  #             requiresThinkingAsText, requiresReasoningContentOnAssistantMessages, thinkingFormat);
  #             supportsDeveloperRole and supportsReasoningEffort default to false
  #   models    id, contextWindow and maxTokens are required; name, reasoning (false) and input (["text"]) are optional.
  #             The cost is always 0. There is no model discovery.
  # via onecli: baseUrl must be https:// with a host NAME (no IP address). Calls go through the OneCLI gateway like the
  #   builtin providers; store the real key as an OneCLI generic secret whose host pattern covers the host.
  # via direct: for a keyless server on the LAN. No gateway, no credential (a key is refused), redirects are refused. The
  #   chart refuses a direct provider without egress, or whose cidr touches 169.254.0.0/16, 100.64.0.0/10 or 127.0.0.0/8.
  # customProviders:
  #   - id: omlx
  #     baseUrl: http://192.168.7.101:8000/v1
  #     via: direct
  #     egress: { cidr: 192.168.7.101/32, port: 8000 }
  #     models:
  #       - { id: <model-id>, contextWindow: 32768, maxTokens: 8192 }
  customProviders: []

github:
  app:
    existingSecret: "" # optional: keys private-key.pem, app-id, installation-id. Repo sessions are off without it.
  # Seeds the repositories a session may clone (ADR 0032): owner/name, owner/* or *. Empty refuses every repo session.
  # Seed only, like models: change it later on the console's settings page or with PUT /admin/settings.
  repoAllowlist: []

# The egress proxy (epic #50, docs/decisions/0035-egress-proxy-runtime.md): a CONNECT proxy that allows a connection only
# when the rules in Postgres (the admin console's Egress page) say so, on the address the host resolves to. On by default
# (ADR 0038, amendment of 2026-11-19): this is the network cutover, so a sandbox reaches the proxy and nothing else (no
# DNS, no direct internet, no direct OneCLI gateway) and every connection is judged by the rules, unless its profile asks
# for `networkMode: direct` (security.allowDirectSandboxEgress). It needs database.existingSecret below (and, with OneCLI,
# binding.existingSecret); hack/install.sh names them pi-egress-database and pi-egress-binding and creates the binding key.
# Opt out with `enabled: false`: the sandbox policies are then as before the proxy existed (DNS, the OneCLI gateway and
# the public internet, directly, unfiltered and unaudited).
egressProxy:
  enabled: true
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # The proxy reads the rules with its own, read-only database role: it can select from the egress rule tables and
  # write only its own status row (egress.proxy_status), so it can never change a rule. CREATE ROLE needs CREATEROLE,
  # which the app's database user lacks, so the operator creates the role once. The bundled Postgres does it with
  # auth.egressReader (charts/pi-postgres); for any other Postgres, see docs/network-policy.md and ADR 0035:
  #   create role pi_egress login password '...'; grant connect on database pi to pi_egress;
  # The app reconciles grants after migrations as the table owner, without a Postgres restart.
  database:
    # Must match the URI username and charts/pi-postgres auth.egressReader.role (or the external Postgres role).
    role: pi_egress
    existingSecret: "" # required: a Secret in the release namespace that holds the connection URI of that role
    uriKey: uri
  # The OneCLI route (ADR 0037): with OneCLI on, the proxy chains `route=onecli` connections to the OneCLI gateway with the
  # session's OneCLI agent token, which the orchestrator stores in egress.bindings sealed (AES-256-GCM) with this key. The
  # Secret holds 32 random bytes, base64 encoded, under `key`; it is mounted into the proxy and the orchestrators only
  # (never a sandbox) and is a backup asset: without it the bindings cannot be opened and repo sessions are refused.
  #   openssl rand -base64 32 | tr -d '\n' | kubectl create secret generic pi-egress-binding --from-file=key=/dev/stdin
  # Needed when egressProxy.enabled and onecli.mode is not disabled.
  binding:
    existingSecret: ""
    key: key
  # Sandboxes send every session's traffic here with a per-session token (ADR 0036, 0037). true (the default, since the
  # network cutover): a request without a token is refused. false: it is judged as anonymous (only the rule sets that apply
  # to all); for a proxy that test pods in `clients` use without a token. A token that is unknown, revoked or used from
  # another Pod is always refused.
  requireAuth: true
  rules:
    pollInterval: 5s # a read without a notification; a rule change usually arrives at once (LISTEN)
    # After this long without a successful read the proxy denies every connection (it never allows on old rules).
    staleAfter: 2m
  # What the proxy refuses whatever the rules say, on top of the built-in loopback, link-local, multicast and reserved
  # ranges: the addresses of the namespace's own Services (ingest, each orchestrator shard, the OneCLI API and gateway),
  # the kubernetes Service, the database host of the proxy's URI and, with database.bundled.release, the bundled
  # Postgres's headless Service. The proxy resolves those names itself every 30 s. These are Service addresses, mostly
  # ClusterIPs: the proxy's NetworkPolicies open the Postgres and OneCLI gateway Pods directly, so a rule that approves
  # the pod network (a cidr or an address range) reaches them unless the pod range is listed in `cidrs` below (ADR 0035).
  # That is the operator's to close: list the namespace's pod range, an external database, anything else that must stay
  # out of reach even from a wide private rule.
  # networkPolicy.kubeApiCidrs and database.external.egress.cidrs are added automatically.
  platform:
    hosts: []
    cidrs: []
  # Who may connect to the proxy besides sandboxes, as raw NetworkPolicy `from` entries (a test pod, a gateway).
  clients: []
  # Public ports the proxy may open towards the internet. A rule that names another port has no effect at the network.
  publicPorts: [80, 443]
  # Private destinations the operator approves for the proxy (the network layer of a private rule, ADR 0034): each a
  # `cidr` or a `namespaceSelector` (with an optional `podSelector`), and the `ports` it is open on. A private rule in
  # the database (Egress page) is still needed; this list alone connects nothing. Cilium does not match pod or service
  # addresses with a cidr: use selectors there.
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: billing } }
  #     podSelector: { matchLabels: { app: api } }
  #     ports: [8080]
  privateEgress: []
