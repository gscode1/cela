# Phase 4c: the two credentials the orchestrator needs to give a session a repository, delivered to the orchestrator only
# (it is the only pod that mounts or references them). Both come from secret-store. Until the remote Secrets exist these
# report SecretSyncedError and the orchestrator's references are optional: sessions without a repo keep working and a
# session that asks for one is refused with a clear message.
#
# pi-github-app: the user's GitHub App (app id and installation id) and an extra private key for it.
# The orchestrator signs an RS256 JWT with it and mints a one-hour installation token limited to one repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pi-github-app
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cluster-secret-store }
  target: { name: pi-github-app, creationPolicy: Owner }
  data:
    - secretKey: private-key.pem
      remoteRef: { key: pi-github-app, property: private-key.pem }
    - secretKey: app-id
      remoteRef: { key: pi-github-app, property: app-id }
    - secretKey: installation-id
      remoteRef: { key: pi-github-app, property: installation-id }
---
# pi-onecli-admin: OneCLI management API key (`oc_...`), used to create and delete per-session agents and secrets.
# NOTE: this is an account-level key (plan.md "Least privilege for OneCLI": a project-scoped key or a separate
# provisioner is the target). Different from pi-onecli, which holds the orchestrator's own proxy agent token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pi-onecli-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cluster-secret-store }
  target: { name: pi-onecli-admin, creationPolicy: Owner }
  data:
    - secretKey: api-key
      remoteRef: { key: pi-onecli-admin, property: api-key }
---
# The orchestrator's OneCLI agent token (`aoc_...`), delivered from secret-store. Create the OneCLI agent and the
# secret-store Secret first (docs/model-credentials.md). Until the remote Secret exists this ExternalSecret reports
# SecretSyncedError and the target Secret is absent; the orchestrator's reference to it is optional, so the scripted
# model keeps working.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pi-onecli
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: cluster-secret-store }
  target: { name: pi-onecli, creationPolicy: Owner }
  data:
    - secretKey: agent-token
      remoteRef: { key: pi-onecli, property: agent-token }
