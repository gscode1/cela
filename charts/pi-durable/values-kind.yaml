# Values for hack/kind-up.sh (docs/install-plan.md section 7, D9): a kind cluster with kindnet and runc, the bundled
# Postgres (charts/pi-postgres), the egress proxy (the chart's default; kind-up.sh --no-egress-proxy opts out) and the
# scripted model only. Images are not set here: kind-up.sh passes them with --set,
# from IMAGE_TAG or per-image refs, or builds them and loads them into the node.
#
# NOT for real use: runc is not gVisor. Agent code runs with container isolation only.

sandbox:
  runtimeClassName: "" # the node default (runc); kind has no gVisor
  storageClass: standard # kind's local-path provisioner; its reclaim policy is Delete

security:
  allowInsecureRuntime: true # the acknowledgement the chart and the orchestrator require for a runtime that is not gVisor

networkPolicy:
  provider: standard # kindnet has no kube-apiserver entity and no FQDN rules

onecli:
  mode: disabled # scripted models only; no credentials are needed

database:
  external:
    existingSecret: pi-database # created by kind-up.sh (hack/install.sh, from DATABASE_URL) for charts/pi-postgres
    egress:
      podSelector: { app.kubernetes.io/name: pi-postgres }

orchestrator:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }

ingest:
  replicas: 1

# The admin console on /console/ of the session API (http://localhost:8080/console/ with the published port); sign in
# with the admin API token. kind-up.sh checks that it answers.
console:
  enabled: true

# The NodePort for the session API (ingest.expose) is turned on by hack/kind-up.sh, with the source address it reads from
# Docker (unless --no-expose); the port matches hack/kind-config.yaml.
