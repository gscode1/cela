{{- /*
Namespace baseline: everything not allowed explicitly is denied, in both directions, for every pod in the namespace.
Only a CNI that enforces NetworkPolicy makes the policies real; flannel alone ignores them. The install reports the
enforcement state (GET /admin/status). docs/network-policy.md has the traffic matrix.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS for every pod, to CoreDNS only. With the network cutover (egressProxy.enabled) sandboxes are left out: a proxied
# sandbox has no DNS (the proxy resolves for it), and a direct one gets it from sandbox-direct-allow-egress (ADR 0038).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
spec:
  {{- if include "pi-durable.networkCutover" . }}
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: NotIn, values: [pi-sandbox] }
  {{- else }}
  podSelector: {}
  {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
