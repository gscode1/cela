apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: pi-env-template
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
spec:
  # Each SandboxClaim carries its own SANDBOXD_AUTH_TOKEN_SHA256 (the hash of HMAC(master, claimName), set by the
  # orchestrator). Allowed lets a claim ADD that variable; the template must not define it, because Allowed rejects an
  # override. Fail closed: a Pod made from a claim without it gets the literal `$(SANDBOXD_AUTH_TOKEN_SHA256)` text as
  # its hash, which no token matches (docs/decisions/0001-per-sandbox-sandboxd-token.md).
  envVarsInjectionPolicy: Allowed
  service: true
  networkPolicyManagement: Unmanaged # this chart owns the policies (templates/networkpolicy)
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.sandbox.storageClass }}
        storageClassName: {{ .Values.sandbox.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.sandbox.workspaceSize }}
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pi-sandbox
    spec:
      {{- if .Values.sandbox.runtimeClassName }}
      runtimeClassName: {{ .Values.sandbox.runtimeClassName }}
      {{- end }}
      automountServiceAccountToken: false
      restartPolicy: Always
      securityContext:
        {{- include "pi-durable.podSecurityContext" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sandboxd
          image: {{ include "pi-durable.image" (dict "name" "sandbox" "image" .Values.images.sandbox) }}
          imagePullPolicy: {{ .Values.images.sandbox.pullPolicy }}
          args:
            - --auth-token-sha256=$(SANDBOXD_AUTH_TOKEN_SHA256)
          ports:
            - containerPort: 8080
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /v1/health, port: 8080 }
          resources:
            {{- toYaml .Values.sandbox.resources | nindent 12 }}
          securityContext:
            {{- include "pi-durable.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
