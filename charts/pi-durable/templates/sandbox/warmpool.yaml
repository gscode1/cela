{{- /*
One SandboxWarmPool per size, plus the unsized pi-env-pool on the default size (see template.yaml), and with
security.allowDirectSandboxEgress the same set for the direct mode, pi-env-direct-pool[-<size>] (ADR 0038). Direct pools
keep no warm Pods: they are template aliases, so allowing direct egress doubles nothing. With
sandbox.flavours.browser.enabled the browser flavour has the same set, pi-env-browser[-direct]-pool[-<size>]
(docs/decisions/0041-browser-sandbox.md); its sized proxied pools keep sandbox.flavours.browser.warmPoolReplicas Pods.
*/ -}}
{{- $root := . -}}
{{- $modes := list "proxied" -}}
{{- if .Values.security.allowDirectSandboxEgress }}{{- $modes = append $modes "direct" -}}{{- end -}}
{{- $browser := $root.Values.sandbox.flavours.browser -}}
{{- $flavours := list "default" -}}
{{- if $browser.enabled }}{{- $flavours = append $flavours "browser" -}}{{- end -}}
{{- $pools := list -}}
{{- range $flavour := $flavours -}}
{{- range $mode := $modes -}}
{{- $pool := ternary "pi-env-direct-pool" "pi-env-pool" (eq $mode "direct") -}}
{{- $template := ternary "pi-env-direct-template" "pi-env-template" (eq $mode "direct") -}}
{{- if eq $flavour "browser" }}
{{- $pool = replace "pi-env-" "pi-env-browser-" $pool -}}
{{- $template = replace "pi-env-" "pi-env-browser-" $template -}}
{{- end -}}
{{- $pools = append $pools (dict "name" $pool "template" $template "size" $root.Values.sandbox.defaultSize "mode" $mode "flavour" $flavour) -}}
{{- range $name := keys $root.Values.sandbox.sizes | sortAlpha -}}
{{- $pools = append $pools (dict "name" (printf "%s-%s" $pool $name) "template" (printf "%s-%s" $template $name) "size" $name "mode" $mode "flavour" $flavour) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $i, $p := $pools -}}
{{- if $i }}
---
{{ end -}}
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "pi-durable.labels" $root | nindent 4 }}
    pi-durable.dev/sandbox-size: {{ $p.size }}
    pi-durable.dev/network-mode: {{ $p.mode }}
    pi-durable.dev/sandbox-flavour: {{ $p.flavour }}
spec:
  {{- /* The unsized pools keep no warm Pods: they would duplicate the default size's pool. */}}
  {{- $replicas := ternary $browser.warmPoolReplicas (index $root.Values.sandbox.sizes $p.size).warmPoolReplicas (eq $p.flavour "browser") }}
  replicas: {{ if or (eq $p.mode "direct") (eq $p.name "pi-env-pool") (eq $p.name "pi-env-browser-pool") }}0{{ else }}{{ $replicas }}{{ end }}
  sandboxTemplateRef:
    name: {{ $p.template }}
{{ end -}}
