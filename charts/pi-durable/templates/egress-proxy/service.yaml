{{- if .Values.egressProxy.enabled }}
# The proxy's address for clients: pi-egress-proxy.<namespace>.svc:3128. Only the proxy port; the probe port is for the
# kubelet.
apiVersion: v1
kind: Service
metadata:
  name: pi-egress-proxy
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pi-egress-proxy
  ports:
    - { name: proxy, port: 3128, targetPort: proxy }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pi-egress-proxy
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pi-egress-proxy
  labels:
    {{- include "pi-durable.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-egress-proxy
{{- end }}
