<!doctype html>
<meta charset="utf-8">
<title>table-grid</title>
<style>
  body { font: 16px sans-serif; }
  table { display: grid; grid-template-columns: repeat(3, 120px); }
  thead, tbody { display: contents; }
  tr { display: contents; }
  th, td { border: 1px solid #888; padding: 4px 10px; }
</style>
<body>
<h1>Restyled table</h1>
<!-- a table that keeps its markup but is a grid, with rows that have no box of their own -->
<table>
  <thead><tr><th>Name</th><th>Mid</th><th>Last</th></tr></thead>
  <tbody>
    <tr><td>Alpha</td><td></td><td>Gamma</td></tr>
    <tr><td>Beta</td><td>2</td><td>3</td></tr>
  </tbody>
</table>
