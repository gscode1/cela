<!doctype html>
<meta charset="utf-8">
<title>drag</title>
<style>
  body { font: 16px sans-serif; }
  .zone { width: 220px; height: 120px; border: 2px dashed #555; display: inline-flex; align-items: center; justify-content: center; margin: 10px; vertical-align: top; }
  .item { width: 110px; padding: 10px; background: #fd6; border: 1px solid #a80; text-align: center; cursor: grab; user-select: none; }
  #handle { position: absolute; left: 30px; top: 330px; }
</style>
<body>
<h1>Drag and drop</h1>
<!-- HTML5 drag and drop: draggable source, drop target with dragover and drop listeners -->
<div class="zone" id="shelf"><div class="item" id="card" draggable="true">Card one</div></div>
<div class="zone" id="target">Drop here</div>
<!-- a pointer drag: mousedown, mousemove and mouseup listeners move the element -->
<div class="item" id="handle">Move me</div>
<div class="zone" id="bin" style="position:absolute; left:420px; top:300px">Bin</div>
<pre id="log" style="position:absolute; top:470px"></pre>
<script>
  const log = document.getElementById("log");
  const add = (t) => (log.textContent += `${log.textContent ? "\n" : ""}${t}`);
  const card = document.getElementById("card");
  const target = document.getElementById("target");
  card.addEventListener("dragstart", (e) => { e.dataTransfer.setData("text/plain", "card"); add("dragstart: card"); });
  target.addEventListener("dragover", (e) => e.preventDefault());
  target.addEventListener("drop", (e) => {
    e.preventDefault();
    target.appendChild(card);
    target.firstChild.textContent = "";
    add(`dropped: ${e.dataTransfer.getData("text/plain")} on target`);
  });
  const h = document.getElementById("handle");
  let from;
  h.addEventListener("mousedown", (e) => { from = { x: e.clientX, y: e.clientY, l: h.offsetLeft, t: h.offsetTop }; e.preventDefault(); });
  document.addEventListener("mousemove", (e) => {
    if (!from) return;
    h.style.left = `${from.l + e.clientX - from.x}px`;
    h.style.top = `${from.t + e.clientY - from.y}px`;
  });
  document.addEventListener("mouseup", (e) => {
    if (!from) return;
    const dx = e.clientX - from.x;
    const dy = e.clientY - from.y;
    from = undefined;
    const b = document.getElementById("bin").getBoundingClientRect();
    const inBin = e.clientX >= b.left && e.clientX <= b.right && e.clientY >= b.top && e.clientY <= b.bottom;
    add(`moved: handle by ${dx},${dy}${inBin ? " into bin" : ""}`);
  });
</script>
