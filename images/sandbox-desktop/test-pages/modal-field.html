<!doctype html>
<meta charset="utf-8">
<title>modal-field</title>
<body style="font:16px sans-serif">
<h1>Results</h1>
<p><label>Search <input id="page-search"></label></p>
<p><label>Find <input id="page-find"></label></p>
<p><button id="open-modal">Open filters</button></p>
<div id="modal" role="dialog" aria-modal="true" aria-label="Filters" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center">
  <div style="background:#fff;padding:20px">
    <p><label>Search <input id="modal-search"></label></p>
    <p><label>Find in brands <input id="modal-find"></label></p>
    <button id="close-modal">Close</button>
  </div>
</div>
<pre id="log"></pre>
<script src="log.js"></script>
<script>
  const log = document.getElementById("log");
  const add = (t) => (log.textContent += `${log.textContent ? "\n" : ""}${t}`);
  const modal = document.getElementById("modal");
  document.getElementById("open-modal").addEventListener("click", () => (modal.style.display = "flex"));
  document.getElementById("close-modal").addEventListener("click", () => (modal.style.display = "none"));
  for (const id of ["page-search", "page-find", "modal-search", "modal-find"]) document.getElementById(id).addEventListener("input", (e) => add(`typed in ${id}: ${e.target.value}`));
</script>
