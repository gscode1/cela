<!doctype html>
<meta charset="utf-8">
<title>custom</title>
<style>
  body { font: 16px sans-serif; }
  .pick { position: relative; padding: 6px 6px 6px 36px; width: 260px; cursor: pointer; }
  .pick input { position: absolute; left: 10px; top: 9px; width: 13px; height: 13px; margin: 0; }
  /* the page's own check box, drawn over the real input by a sibling's or a label's ::before */
  .deco::before, .lbl::before { content: ""; position: absolute; left: 4px; top: 3px; width: 30px; height: 30px; border: 1px solid #555; background: #fff; }
  #dlg { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); display: none; align-items: center; justify-content: center; }
  #dlg > div { background: #fff; padding: 24px; width: 320px; }
</style>
<body>
<h1>Ports</h1>
<!-- a sibling span's ::before over a visible input; the row toggles it -->
<div class="pick" id="row-dp"><input type="checkbox" id="dp" aria-label="DisplayPort"><span class="deco"></span>DisplayPort</div>
<!-- a for= label whose ::before sits over the visible input -->
<div class="pick"><input type="checkbox" id="usbc"><label class="lbl" for="usbc">USB-C</label></div>
<p><button id="open">Open notice</button></p>
<div role="dialog" aria-modal="true" aria-label="Notice" id="dlg"><div><p>Read this first.</p><button id="close">Close notice</button></div></div>
<pre id="log"></pre>
<script>
  const log = document.getElementById("log");
  const add = (t) => (log.textContent += `${log.textContent ? "\n" : ""}${t}`);
  for (const id of ["dp", "usbc"]) document.getElementById(id).addEventListener("change", (e) => add(`checked: ${id} ${e.target.checked}`));
  document.getElementById("row-dp").addEventListener("click", (e) => {
    if (e.target.id === "dp") return;
    const i = document.getElementById("dp");
    i.checked = !i.checked;
    i.dispatchEvent(new Event("change"));
  });
  document.getElementById("open").onclick = () => (document.getElementById("dlg").style.display = "flex");
  document.getElementById("close").onclick = () => (document.getElementById("dlg").style.display = "none");
</script>
