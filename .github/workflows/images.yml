# Builds the six images (orchestrator, ingest, sandbox, sandbox-browser, egress-proxy, e2e-driver) for linux/amd64 and linux/arm64 with
# images/build.sh and pushes them to ghcr.io/<owner>, tagged <version>-<short sha>. Pull requests from forks only
# build: their token cannot write packages.
name: images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # build.sh tags with the short sha of HEAD; on a pull request that must be the branch head, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: images/build.sh all --push | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build only (fork pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: images/build.sh all
