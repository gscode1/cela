# `pnpm check` (build, lint, format, typecheck, unit tests). The tests render the Helm charts, so helm is installed at a
# pinned version, and the Go module packages/egress-proxy needs Go. The feed tests need a real Postgres (its snapshot
# semantics are what they test), so the job runs one as a service; each test run creates and drops its own database.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: packages/egress-proxy/go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          CELA_TEST_DATABASE_URL: postgres://postgres:ci-only@localhost:5432/postgres
