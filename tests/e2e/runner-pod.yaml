# Stand-in orchestrator: the driver image includes the Phase 1 bundle.
apiVersion: v1
kind: Pod
metadata:
  name: e2e-runner
  labels:
    app.kubernetes.io/name: pi-orchestrator
spec:
  serviceAccountName: e2e-runner
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: node
      image: __DRIVER_IMAGE__
      # Copy then rename: /work/app appears complete or not at all, and readiness waits for it. A plain copy let
      # run-phase1.sh exec node while node_modules was still being copied (ERR_MODULE_NOT_FOUND).
      command:
        [bash, -c, "cp -a /opt/phase1 /work/app.tmp && mv /work/app.tmp /work/app && sleep 86400"]
      readinessProbe:
        exec:
          command: [test, -f, /work/app/package.json]
        periodSeconds: 1
      env:
        - name: HOME
          value: /work
        - name: PI_SANDBOX_NAMESPACE
          valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
        # run-phase1.sh sets the claim name and derives PI_SANDBOX_AUTH_TOKEN from the master inside this pod.
        - name: PI_SANDBOX_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: sandboxd-auth
              key: master
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
