# Identity, RBAC and the code volume of the in-cluster e2e driver (the Job that runs tests/e2e/run-phase*.sh).
# Applied by tests/e2e/run.sh. Namespace-scoped: nothing here is cluster-wide.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - driver-rbac.yaml
  - driver-pvc.yaml
  - runner-rbac.yaml
