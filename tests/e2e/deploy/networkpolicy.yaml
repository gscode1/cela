# The e2e driver Job (tests/e2e/job.yaml.tpl, label app.kubernetes.io/name=e2e-driver) and the Phase 1 runner pod
# (tests/e2e/runner-pod.yaml, which carries the orchestrator label and therefore uses the orchestrator policies).
#
# The suites do everything through the Kubernetes API (`kubectl exec` into ingest and the orchestrator, get, wait,
# delete, scale), so the driver needs the API (tests/e2e/deploy/cilium/kube-apiserver.yaml) and DNS (allow-dns-egress), and nothing
# else. The orchestrator and ingest ports below are for direct calls a suite may make; remove them if unused.
# The driver accepts no ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-driver-allow-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: e2e-driver
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pi-orchestrator
      ports:
        - { protocol: TCP, port: 8081 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pi-ingest
      ports:
        - { protocol: TCP, port: 8080 }
---
# The chart's policies admit only ingest to the orchestrator and, with networkPolicy.ingest.clients (chart-values.py),
# the driver to ingest. The driver also calls the orchestrators directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-driver-allow-orchestrator-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pi-orchestrator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: e2e-driver
      ports:
        - { protocol: TCP, port: 8081 }
