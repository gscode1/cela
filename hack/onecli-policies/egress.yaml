# Example OneCLI egress, the OPEN default (docs/decisions/0043-open-onecli-defaults.md): DNS, database and TCP 443 to anything
# outside the cluster (`world`), which includes the LAN. A LAN MCP server whose key OneCLI injects works; every other port to
# the LAN, and every address inside the cluster, stays closed. 169.254.0.0/16 (cloud metadata) and 100.64.0.0/10 (CGNAT) are
# denied outright. For an allowlist instead, apply egress-strict.yaml (same name: it replaces this policy, never both).
# Pair it with the gateway's own allowPrivateDestinations (charts/pi-onecli/upstream-values.yaml); OneCLI refuses private
# addresses without it. Adapt dependencies before applying. Roll out in audit mode, inspect Hubble, then enforce. See README.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onecli-egress
  namespace: onecli
spec:
  endpointSelector:
    matchLabels:
      app: onecli
  egressDeny:
    - toCIDRSet:
        - cidr: 169.254.0.0/16
        - cidr: 100.64.0.0/10
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: onecli
            cnpg.io/cluster: onecli-db
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - toEntities:
        - world
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
