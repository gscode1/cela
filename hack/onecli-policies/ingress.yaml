# Example: admit orchestrators to gateway and API, sandboxes to gateway only.
# Adapt namespace and pod selectors; the final ingress-controller rule is optional. See README.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onecli-ingress
  namespace: onecli
spec:
  endpointSelector:
    matchLabels:
      app: onecli
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cela-dev
            app.kubernetes.io/name: pi-orchestrator
      toPorts:
        - ports:
            - { port: "10255", protocol: TCP }
            - { port: "10256", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cela-dev
            app.kubernetes.io/name: pi-sandbox
      toPorts:
        - ports:
            - { port: "10255", protocol: TCP }
    # Trusted e2e namespaces (only cluster operators may assign this label).
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.cela-e2e: "true"
            app.kubernetes.io/name: pi-orchestrator
      toPorts:
        - ports:
            - { port: "10255", protocol: TCP }
            - { port: "10256", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.cela-e2e: "true"
            app.kubernetes.io/name: pi-sandbox
      toPorts:
        - ports:
            - { port: "10255", protocol: TCP }
    # The egress proxy of an e2e run: the route=onecli upstream of repo sessions (ADR 0037), gateway only.
    - fromEndpoints:
        - matchLabels:
            k8s:io.cilium.k8s.namespace.labels.cela-e2e: "true"
            app.kubernetes.io/name: pi-egress-proxy
      toPorts:
        - ports:
            - { port: "10255", protocol: TCP }
    # Optional ingress-controller example; replace or remove for port-forward-only access.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway-system
            app.kubernetes.io/name: envoy
            app.kubernetes.io/component: proxy
      toPorts:
        - ports:
            - { port: "10254", protocol: TCP }
            - { port: "10255", protocol: TCP }
            - { port: "10256", protocol: TCP }
