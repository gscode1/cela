# Orchestrator state store. Own CNPG cluster in this namespace; the operator in postgres-system is shared and untouched.
# Connect through the pi-pg-rw service only: the adapter's ownership lock is a session advisory lock.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pi-pg
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  enableSuperuserAccess: false
  storage:
    size: 1Gi
    storageClass: longhorn-static
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  bootstrap:
    initdb:
      database: app
      owner: app
      # The adapter wants a dedicated schema; its tables are not prefixed.
      postInitApplicationSQL:
        - CREATE SCHEMA IF NOT EXISTS durable AUTHORIZATION app
