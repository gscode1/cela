apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pi-durable-poc
resources:
  - namespace.yaml
  - sandbox-template.yaml
  - sandbox-warmpool.yaml
  - networkpolicy.yaml
  - networkpolicy-ingest.yaml
  - networkpolicy-orchestrator.yaml
  - networkpolicy-postgres.yaml
  - networkpolicy-e2e.yaml
  - postgres.yaml
  - orchestrator-rbac.yaml
  - orchestrator-service.yaml
  - model-config.yaml
  - onecli-externalsecret.yaml
  - repo-externalsecrets.yaml
  - orchestrator.yaml
  - ingest.yaml
# Secrets `sandboxd-auth` and `api-auth` are NOT here: create them with deploy/gen-secret.sh and
# deploy/gen-api-secret.sh.
# Secret `pi-onecli` comes from onecli-externalsecret.yaml; ConfigMap `onecli-ca` from deploy/fetch-onecli-ca.sh.
# Secret `pi-pg-app` is generated by CloudNativePG.
