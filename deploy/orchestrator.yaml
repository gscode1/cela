# One replica, Recreate: the Postgres adapter allows a single owner per schema. This is shard 0, the only shard of a
# default stack. More shards are Deployments `pi-orchestrator-<k>` cloned from this one by deploy/add-shard.sh, each
# owning its own schema `durable_s<k>` (docs/decisions/0017-schema-sharding.md).
# Replace the example image with a built digest (deploy/README.md).
# The DB URI comes from the CNPG-generated secret pi-pg-app and is never printed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-orchestrator
  labels:
    app.kubernetes.io/name: pi-orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pi-orchestrator
      app.kubernetes.io/instance: pi-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pi-orchestrator
        app.kubernetes.io/instance: pi-orchestrator
    spec:
      serviceAccountName: pi-orchestrator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orchestrator
          image: registry.example.com/team/pi-orchestrator:replace-me
          # PI_MODEL_ALLOWLIST (which providers to install), the fallback default model and turn budget until
          # inbox.settings is seeded. The live default and turn budget come from Postgres (PUT /admin/settings).
          envFrom:
            - configMapRef: { name: pi-model-config }
          env:
            - { name: HOME, value: /tmp }
            # The namespace this pod runs in: one manifest serves the long-lived deployment and every e2e run
            # namespace (docs/e2e.md), so it is never written out.
            - name: PI_ORCH_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: PI_ORCH_WARMPOOL, value: pi-env-pool }
            - { name: PI_ORCH_PORT, value: "8081" }
            - { name: PI_DURABLE_SCHEMA, value: durable }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: PI_DURABLE_DATABASE_URL
              valueFrom: { secretKeyRef: { name: pi-pg-app, key: uri } }
            # Master key of the per-sandbox sandboxd tokens: HMAC(master, claim). Never reaches a bridge or a sandbox.
            - name: PI_SANDBOX_MASTER_KEY
              valueFrom: { secretKeyRef: { name: sandboxd-auth, key: master } }
            # Same bearer tokens as ingest (create with deploy/gen-api-secret.sh): the stream endpoint
            # authenticates the caller again and checks the session owner.
            - name: PI_API_TOKENS
              valueFrom: { secretKeyRef: { name: api-auth, key: tokens } }
            # Model calls go through the OneCLI gateway with this agent token (an ExternalSecret from secret-store,
            # deploy/onecli-externalsecret.yaml). Optional so the scripted model runs without it. It is read from the
            # environment once and never logged; the bridge is started with a trimmed environment (bridgeCommand).
            - name: ONECLI_AGENT_TOKEN
              valueFrom: { secretKeyRef: { name: pi-onecli, key: agent-token, optional: true } }
            # Phase 4c: management API key for per-session OneCLI agents (repo sessions only; optional).
            - name: ONECLI_API_KEY
              valueFrom: { secretKeyRef: { name: pi-onecli-admin, key: api-key, optional: true } }
            # PI_MAX_OPEN_BRIDGES is not set: the cap on open sandbox bridges is derived from the memory limit below
            # ((limit - 256 MiB) / 24 MiB, 74 at 2Gi), so changing the limit changes the cap. Keep the request equal
            # to the limit. docs/decisions/0018-derived-bridge-cap.md, docs/scaling.md.
            - { name: PI_ONECLI_NAME_PREFIX, value: "pi-session-" }
            - { name: PI_ONECLI_API, value: "http://onecli.onecli:10256" }
            - { name: PI_ONECLI_GATEWAY, value: "http://onecli.onecli:10255" }
            - { name: PI_ONECLI_CA_FILE, value: /etc/onecli/ca.pem }
            # No process-wide HTTPS_PROXY: only pi-ai's model calls use a dispatcher scoped to the gateway. NO_PROXY
            # extends the built-in cluster suffixes and configured database/API hosts.
            - { name: NO_PROXY, value: "" }
            # Remote MCP servers are not configured here: they live in Postgres (inbox.mcp_servers) and are managed through
            # ingest's /admin/mcp-servers, no restart (docs/decisions/0009-mcp-catalog-in-postgres.md). An empty catalog means
            # no tool_search and no MCP tools. The orchestrator calls a server through the OneCLI gateway: it needs
            # ONECLI_AGENT_TOKEN and the host in the OneCLI host rules and the egress policy.
            # Test-only, both off unless set. CONTROL mounts the authenticated Phase 3 scripted-session surface
            # under /control. TEST_FAULTS honours payload.testFault on inbox rows, which only SQL can write
            # (ingest never does), so the Phase 4 suite can kill the orchestrator between submit and mark.
          ports:
            - { name: control, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: control }
            periodSeconds: 3
          # /healthz is a pure event-loop check: no Postgres, no drain, and 200 while waiting for the schema lock,
          # so a standby or a long drain never gets killed. 6 x 10 s of failures means the process is wedged.
          livenessProbe:
            httpGet: { path: /healthz, port: control }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 2Gi }
            limits: { cpu: "1", memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: onecli-ca, mountPath: /etc/onecli, readOnly: true }
            - { name: github-app, mountPath: /etc/pi-github-app, readOnly: true }
      volumes:
        # GitHub App key for minting per-repo tokens (ExternalSecret pi-github-app); optional like the CA.
        - name: github-app
          secret: { secretName: pi-github-app, optional: true }
        # Filled by deploy/fetch-onecli-ca.sh; optional so the scripted model starts without it.
        - name: onecli-ca
          configMap: { name: onecli-ca, optional: true }
