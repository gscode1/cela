# Example OneCLI egress: DNS, database and public HTTPS allowlist. Adapt dependencies before applying.
# Private CIDR denies protect against DNS rebinding; verify their interaction with database endpoints.
# Roll out in audit mode, inspect Hubble, then enforce. See README.md.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: onecli-egress
  namespace: onecli
spec:
  endpointSelector:
    matchLabels:
      app: onecli
  egressDeny:
    - toCIDRSet:
        - cidr: 10.0.0.0/8
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
        - cidr: 100.64.0.0/10
        - cidr: 169.254.0.0/16
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: onecli
            cnpg.io/cluster: onecli-db
      toPorts:
        - ports:
            - { port: "5432", protocol: TCP }
    - toFQDNs:
        # Model providers (ChatGPT/Codex subscription, OpenAI API, OpenRouter).
        - matchName: chatgpt.com
        - matchPattern: "*.chatgpt.com"
        - matchName: auth.openai.com
        - matchName: api.openai.com
        - matchName: openrouter.ai
        # GitHub (Phase 4c clone and push).
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: objects.githubusercontent.com
        # Package registries.
        - matchName: registry.npmjs.org
        - matchName: pypi.org
        - matchName: files.pythonhosted.org
        # Remote MCP servers called by the orchestrator (docs/decisions/0007-native-remote-mcp.md).
        - matchName: mcp.deepwiki.com
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
