# CiliumNetworkPolicies for namespace pi-durable-poc: what standard NetworkPolicy cannot express.
# NOT part of deploy/kustomization.yaml on purpose: the CRDs require Cilium, and a
# kubectl apply of the main kustomization must keep working before then. Apply this one in the same step as the
# standard policies once `kubectl get crd ciliumnetworkpolicies.cilium.io` succeeds:
#   kubectl apply -k deploy/cilium    (then kubectl apply -k deploy)
# See docs/network-policy.md for the order and the rollback.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pi-durable-poc
resources:
  - kube-apiserver.yaml
  - dns.yaml
  - orchestrator-github.yaml
